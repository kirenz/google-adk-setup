project:
  type: book

lang: en

execute:
  freeze: auto
  echo: true
  warning: false

book:
  title: "ADK Setup"
  description: "Google Agent Development Kit (ADK) Setup"
  image: "/images/logo.png"
  favicon: "/images/logo.png"

  search:
    type: overlay

  page-footer:
    left: |
      © [Jan Kirenz](https://www.kirenz.com/), 2025

  chapters:
    - index.qmd

    - part: setup/index.qmd
      chapters:
        - setup/preparation.qmd
        - setup/python-install/index.qmd
        - setup/python-install/macos-no-brew.qmd
        - setup/python-install/windows.qmd
        - setup/venv-and-pip.qmd
        - setup/adk-install.qmd
        - setup/first-agent.qmd
        - setup/jupyter.qmd

    - part: troubleshooting/index.qmd
      chapters:
        - troubleshooting/common-errors.qmd

    - part: appendix/glossary.qmd
      chapters:
        - appendix/faq.qmd
        - appendix/references.qmd

format:
  html:
    toc: true
    theme: cosmo
    css: theme.scss
    code-copy: true
    highlight-style: github-dark
    code-overflow: wrap
    author-meta: "Jan Kirenz"
    callout-appearance: simple
    include-in-header:
      text: |
        <style>
        .cmd-explain {
          font-weight: 600;
          margin-top: 1rem;
        }
        </style>
